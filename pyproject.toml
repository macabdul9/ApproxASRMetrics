[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "approx_asr"
version = "0.1.0"
description = "Reference-free approximation of ASR word and character error rates"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scikit-learn>=1.3", "jiwer>=3.0", "datasets", "tqdm"]

[project.optional-dependencies]
plot = ["matplotlib"]
dev = ["pytest>=8", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
